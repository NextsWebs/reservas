<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reserva tu mesa</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)), url(img/fondo.png);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      max-width: 420px;
      width: 100%;
      padding: 24px 26px 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      animation: fadeIn 0.6s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    h1 {
      margin-top: 0;
      margin-bottom: 6px;
      font-weight: 600;
      text-align: center;
      color: #1f4037;
    }
    p.subtitle {
      text-align: center;
      margin-top: 0;
      margin-bottom: 20px;
      color: #666;
      font-size: 0.95rem;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.85rem;
      color: #333;
      font-weight: 500;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-family: inherit;
      font-size: 0.95rem;
      margin-bottom: 14px;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #1f4037;
      box-shadow: 0 0 0 2px rgba(31,64,55,0.1);
    }
    textarea { resize: vertical; min-height: 80px; }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: #1f4037;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.25s ease, transform 0.1s ease;
    }
    button:hover { background: #163028; }
    button:active { transform: scale(0.98); }
    .footer {
      text-align: center;
      margin-top: 14px;
      font-size: 0.75rem;
      color: #777;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Reservar Mesa</h1>
    <p class="subtitle">Completá los datos y confirmá por WhatsApp</p>

    <form id="reservaForm">
      <label for="nombre">Nombre de la reserva*</label>
      <input type="text" id="nombre" required placeholder="Tu nombre" />

      <label for="fecha">Fecha*</label>
      <input type="date" id="fecha" required />

      <label for="personas">Cantidad de personas*</label>
      <select id="personas" required>
        <option value="">Seleccionar</option>
        <option>1</option>
        <option>2</option>
        <option>3</option>
        <option>4</option>
        <option>5</option>
        <option>6</option>
        <option>7</option>
        <option>8</option>
        <option>9</option>
        <option>10+</option>
      </select>

      <label for="hora">Horario*</label>
      <select id="hora" required>
        <option value="">Seleccionar</option>
      </select>

      <label for="obs">Observaciones</label>
      <textarea id="obs" placeholder="Ej: cumpleaños, mesa afuera, alergias..."></textarea>

      <button type="submit">Enviar reserva por WhatsApp</button>
    </form>

    <div class="footer">Horario disponible de 19:00 a 23:00</div>
  </div>

  <script>
    // Generar horarios cada 30 minutos de 19:00 a 23:00
    const horaSelect = document.getElementById('hora');
    for (let h = 19; h <= 23; h++) {
      for (let m = 0; m < 60; m += 30) {
        if (h === 23 && m > 0) continue;
        const hh = h.toString().padStart(2, '0');
        const mm = m.toString().padStart(2, '0');
        const opt = document.createElement('option');
        opt.value = `${hh}:${mm}`;
        opt.textContent = `${hh}:${mm}`;
        horaSelect.appendChild(opt);
      }
    }

    document.getElementById('reservaForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const nombre = document.getElementById('nombre').value;
      const fechaISO = document.getElementById('fecha').value;
      let fecha = '';
      if (fechaISO) {
        const [y, m, d] = fechaISO.split('-');
        fecha = `${d}/${m}/${y.slice(2)}`;
      }
      const personas = document.getElementById('personas').value;
      const hora = document.getElementById('hora').value;
      const obs = document.getElementById('obs').value;

      const mensaje = `Hola! Quiero reservar una mesa.%0A%0A` +
        `Nombre: ${nombre}%0A` +
        `Fecha: ${fecha}%0A` +
        `Hora: ${hora}%0A` +
        `Personas: ${personas}%0A` +
        `Observaciones: ${obs || 'Ninguna'}`;

      const telefono = '5493424326966';
      const url = `https://wa.me/${telefono}?text=${mensaje}`;

      window.open(url, '_blank');
    });
  </script>
</body>
</html>
